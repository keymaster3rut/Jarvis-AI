name: Android Release (Indonesian)

# Builds JARVIS with Indonesian understanding for the AI agent, arm64 only.
# Run it from the Actions tab: Android Release (Indonesian) -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply minimal Indonesian patch
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          """Minimal patch: lets the AI agent understand Indonesian commands.
          Changes ONLY the AI prompt text (+ app id/label so it can sit next to the
          original app). No speech recognition, no TTS, no wake word, no routing."""
          import sys
          import pathlib

          ROOT = pathlib.Path('.')


          def sub(p, old, new):
              f = ROOT / p
              t = f.read_text(encoding='utf-8')
              n = t.count(old)
              if n != 1:
                  sys.exit(f'PATCH FAILED in {p}: expected 1 match, found {n} for: {old[:80]!r}')
              f.write_text(t.replace(old, new), encoding='utf-8')
              print(f'  ok  {p}')


          AGENT = (
              "LANGUAGE: The user's GOAL may be written in Indonesian (Bahasa Indonesia) or English. "
              "Understand both and act on it exactly as you would for the English equivalent. "
              "Indonesian action words mean: buka=open, cari/carikan=search, putar/mainkan=play, ketik=type, "
              "kirim=send, pasang/unduh/instal=install/download, kembali=back, beranda=home, gulir=scroll, "
              "pilih=select, tekan/klik/ketuk=tap, nyalakan/aktifkan=turn on, matikan/nonaktifkan=turn off, tonton=watch. "
              "The phone UI may be in Indonesian or English: match click_text against the labels actually shown in the "
              "screen dump (for example Cari or Search, Kirim or Send, Pasang or Install) and try the other language when "
              "a label is not found. Rules 2, 3 and 4 below apply equally to Indonesian goals "
              "(for example pasang instagram means install, putar video or tonton means YouTube). "
              "Keep the JSON keys and action names in English exactly as specified. "
              "Text entered with type_text stays in the language the user asked for."
          )

          CLASSIFIER = (
              "LANGUAGE: The voice command may be Indonesian (Bahasa Indonesia) or English. Classify by meaning, "
              "for example nyalakan senter means torch on, cuaca di Jakarta means weather, jam berapa means datetime, "
              "buka YouTube lalu putar lagu means action, ingatkan saya besok jam 8 means calendar, catat means notes, "
              "kirim WhatsApp ke means message, berita terbaru means news, cari tahu means web_search. "
              "Keep the type value and code-like tool_arg values exactly in English: on or off, and the system commands "
              "volume_up, volume_down, mute, unmute, brightness_up, brightness_down, screenshot, home, back, sentry_arm, "
              "sentry_disarm. For action, write the goal in tool_arg in clear Indonesian and do not translate names of "
              "apps, people or songs. For an Indonesian command that asks the phone to do something (open, install, play, "
              "search inside an app, change a setting, tap, type, scroll), choose action instead of chat. "
              "Everything else about your output stays exactly as specified."
          )

          # App id + label so it installs next to the original app
          sub('android/app/build.gradle.kts', 'applicationId = "com.privateagent.private_agent"',
              'applicationId = "com.privateagent.jarvis_id"')
          sub('android/app/src/main/AndroidManifest.xml', 'android:label="JARVIS"',
              'android:label="JARVIS ID"')
          sub('android/app/src/main/res/values/strings.xml',
              '<string name="accessibility_service_label">PrivateAgent Screen Control</string>',
              '<string name="accessibility_service_label">JARVIS ID Screen Control</string>')

          # The only behavioural change: two prompt paragraphs
          ai = 'lib/services/ai_service.dart'
          sub(ai, 'You are PrivateAgent, an autonomous Android UI automation agent.',
              'You are PrivateAgent, an autonomous Android UI automation agent.\n' + AGENT)
          sub(ai, "Analyze the user's voice command:", CLASSIFIER + "\n\nAnalyze the user's voice command:")
          print('Minimal Indonesian patch applied.')
          PYEOF

      - name: Flutter version and dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk JARVIS-ID-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ID-arm64
          path: JARVIS-ID-arm64.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-id-${{ github.run_number }}
          name: JARVIS ID (Indonesian) build ${{ github.run_number }}
          files: JARVIS-ID-arm64.apk
